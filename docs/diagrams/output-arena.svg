<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 635" role="img" aria-labelledby="output-arena-title output-arena-desc" class="diagram-svg">
<title id="output-arena-title">A bounded arena reduces small-response send operations</title><desc id="output-arena-desc">Headers, generated bodies and small copied borrows occupy adjacent arena ranges. Larger borrowed bodies remain separate vectors. SEND handles one selected span; SENDMSG handles several. Partial progress can require more operations.</desc>
<defs><marker id="output-arena-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50636b"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="28" y="39" font-size="15" fill="#d94b2b" font-weight="700" text-anchor="start">ONE CONNECTION · OUTPUT ARENA</text><text x="28" y="80" font-size="26" fill="#172f40" font-weight="650" text-anchor="start">Small responses share one contiguous span.</text><rect x="28" y="118" width="122" height="88" rx="0" fill="#dce9ed" stroke="#c8d0cb"/><text x="89.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Head A</text><rect x="150" y="118" width="186" height="88" rx="0" fill="#e5ecdf" stroke="#c8d0cb"/><text x="243.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Body A</text><rect x="336" y="118" width="122" height="88" rx="0" fill="#dce9ed" stroke="#c8d0cb"/><text x="397.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Head B</text><rect x="458" y="118" width="186" height="88" rx="0" fill="#e5ecdf" stroke="#c8d0cb"/><text x="551.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Body B</text><rect x="644" y="118" width="122" height="88" rx="0" fill="#dce9ed" stroke="#c8d0cb"/><text x="705.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Head C</text><rect x="766" y="118" width="186" height="88" rx="0" fill="#e5ecdf" stroke="#c8d0cb"/><text x="859.0" y="169" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Body C</text><rect x="952" y="118" width="120" height="88" rx="0" fill="#f0eee5" stroke="#c8d0cb"/><text x="1012.0" y="169" font-size="16" fill="#50636b" font-weight="400" text-anchor="middle">Free</text><path d="M 490 206 V 245" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#output-arena-arrow)"/><text x="490" y="278" font-size="21" fill="#172f40" font-weight="650" text-anchor="middle">One selected span → SEND</text><text x="28" y="337" font-size="26" fill="#172f40" font-weight="650" text-anchor="start">Large borrowed bodies remain separate.</text><rect x="28" y="367" width="320" height="88" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="188" y="418" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Arena prefix</text><rect x="390" y="367" width="320" height="88" rx="10" fill="#f6e7df" stroke="#dfc3b6"/><text x="550" y="408" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Borrowed body</text><text x="550" y="434" font-size="15" fill="#50636b" font-weight="400" text-anchor="middle">Request or immutable asset</text><rect x="752" y="367" width="320" height="88" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="912" y="418" font-size="20" fill="#172f40" font-weight="550" text-anchor="middle">Arena suffix</text><path d="M 348 411 H 386" fill="none" stroke="#50636b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#output-arena-arrow)"/><path d="M 710 411 H 748" fill="none" stroke="#50636b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#output-arena-arrow)"/><path d="M 550 455 V 495" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#output-arena-arrow)"/><text x="550" y="527" font-size="21" fill="#172f40" font-weight="650" text-anchor="middle">Several selected spans → SENDMSG</text><text x="550" y="574" font-size="18" fill="#50636b" font-weight="450" text-anchor="middle">Every referenced byte remains valid until the target send completes.</text><text x="550" y="605" font-size="18" fill="#50636b" font-weight="450" text-anchor="middle">Small borrowed spans may be copied. Kernel socket copies remain.</text></g></svg>
