<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 604" role="img" aria-labelledby="startup-title startup-desc" class="diagram-svg">
<title id="startup-title">Startup separates resource creation from request I/O</title><desc id="startup-desc">main validates configuration, loads assets and initializes the cluster. start prepares threads. main seals the budget before run releases the startup gate.</desc>
<defs><marker id="startup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50636b"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="28" y="36" width="310" height="493" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="51" y="79" font-size="28" fill="#d94b2b" font-weight="600" text-anchor="start">01</text><text x="51" y="113" font-size="15" fill="#172f40" font-weight="700" text-anchor="start">PREPARE</text><text x="51" y="169" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Read settings</text><text x="51" y="199" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">main parses arguments and</text><text x="51" y="222" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">validates Config.</text><text x="51" y="285" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Load assets</text><text x="51" y="315" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">main reads HTML before request</text><text x="51" y="338" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">I/O.</text><text x="51" y="401" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Reserve resources</text><text x="51" y="431" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Budget and Cluster allocate</text><text x="51" y="454" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">startup storage.</text><path d="M 338 284 H 384" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#startup-arrow)"/><rect x="395" y="36" width="310" height="493" rx="10" fill="#e5ecdf" stroke="#c8d0cb"/><text x="418" y="79" font-size="28" fill="#d94b2b" font-weight="600" text-anchor="start">02</text><text x="418" y="113" font-size="15" fill="#172f40" font-weight="700" text-anchor="start">PREPARE THREADS</text><text x="418" y="169" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Install stop handling</text><text x="418" y="199" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">The demo installs signal</text><text x="418" y="222" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">handlers.</text><text x="418" y="285" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Call Cluster.start()</text><text x="418" y="315" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Secondary owners wait behind a</text><text x="418" y="338" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">startup gate.</text><text x="418" y="401" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Seal Budget</text><text x="418" y="431" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">main refuses later framework</text><text x="418" y="454" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">allocations.</text><path d="M 705 284 H 751" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#startup-arrow)"/><rect x="762" y="36" width="310" height="493" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="785" y="79" font-size="28" fill="#d94b2b" font-weight="600" text-anchor="start">03</text><text x="785" y="113" font-size="15" fill="#172f40" font-weight="700" text-anchor="start">SERVE AND CLOSE</text><text x="785" y="169" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Print READY</text><text x="785" y="199" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Startup has completed.</text><text x="785" y="285" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Call Cluster.run()</text><text x="785" y="315" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">The gate opens. Owners process</text><text x="785" y="338" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">requests.</text><text x="785" y="401" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">Finish shutdown</text><text x="785" y="431" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Owners drain. main reports stats</text><text x="785" y="454" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">and deinitializes.</text><text x="550" y="572" font-size="19" fill="#172f40" font-weight="550" text-anchor="middle">No request I/O crosses the gate before the allocator is sealed.</text></g></svg>
