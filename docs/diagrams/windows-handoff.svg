<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="windows-handoff-title windows-handoff-desc" class="diagram-svg">
<title id="windows-handoff-title">Windows: one listener, independent IOCP owners</title>
<desc id="windows-handoff-desc">Shard zero accepts without reading request bytes. A shared admission charge follows each socket through a fixed queue into its destination IOCP. Shard zero also handles connections. Every owner keeps private buffers. Receivers drain queues after acquiring the producer completion flag.</desc>
<defs><marker id="windows-handoff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50636b"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="32" y="24" width="236" height="70" rx="10" fill="#172f40"/>
<text x="150" y="66" text-anchor="middle" font-size="23" fill="#fbfaf5" font-weight="650">HTTP clients</text>
<path d="M 268 59 H 330" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#windows-handoff-arrow)"/>
<rect x="336" y="24" width="730" height="70" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/>
<text x="358" y="54" font-size="21" fill="#172f40" font-weight="650">One exclusive listener · owned by shard 0</text>
<text x="358" y="80" font-size="16" fill="#50636b">AcceptEx completes without receiving request bytes</text>
<path d="M 552 94 V 125" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#windows-handoff-arrow)"/>
<rect x="336" y="132" width="730" height="72" rx="10" fill="#e5ecdf" stroke="#c4d0bb"/>
<text x="358" y="162" font-size="20" fill="#172f40" font-weight="650">Reserve admission · choose the next destination</text>
<text x="358" y="188" font-size="16" fill="#50636b">The socket has no IOCP association and no borrowed request buffer</text>
<path d="M 552 204 V 232 H 189 V 352 M 552 232 V 259 M 552 232 H 916 V 259" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#windows-handoff-arrow)"/>
<text x="189" y="291" text-anchor="middle" font-size="17" fill="#50636b">Local share</text>
<text x="189" y="315" text-anchor="middle" font-size="15" fill="#50636b">No queue or extra thread</text>
<rect x="396" y="262" width="312" height="64" rx="10" fill="#fff0e5" stroke="#e4bda8"/>
<text x="552" y="289" text-anchor="middle" font-size="19" fill="#172f40" font-weight="600">Fixed queue · capacity C</text>
<text x="552" y="312" text-anchor="middle" font-size="15" fill="#50636b">Socket handle + acceptance time</text>
<rect x="760" y="262" width="312" height="64" rx="10" fill="#fff0e5" stroke="#e4bda8"/>
<text x="916" y="289" text-anchor="middle" font-size="19" fill="#172f40" font-weight="600">Fixed queue · capacity C</text>
<text x="916" y="312" text-anchor="middle" font-size="15" fill="#50636b">Socket handle + acceptance time</text>
<path d="M 552 326 V 352 M 916 326 V 352" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#windows-handoff-arrow)"/>
<rect x="32" y="360" width="312" height="157" rx="10" fill="#dce9ed" stroke="#bdcfd6"/>
<text x="54" y="393" font-size="23" fill="#172f40" font-weight="650">Shard 0 · caller thread</text>
<text x="54" y="425" font-size="18" fill="#172f40">Own IOCP + C private slots</text>
<text x="54" y="453" font-size="16" fill="#50636b">Associate socket, then receive</text>
<text x="54" y="483" font-size="16" fill="#50636b">Input + arena + operation records</text>
<rect x="396" y="360" width="312" height="157" rx="10" fill="#dce9ed" stroke="#bdcfd6"/>
<text x="418" y="393" font-size="23" fill="#172f40" font-weight="650">Shard 1 · startup thread</text>
<text x="418" y="425" font-size="18" fill="#172f40">Own IOCP + C private slots</text>
<text x="418" y="453" font-size="16" fill="#50636b">Associate socket, then receive</text>
<text x="418" y="483" font-size="16" fill="#50636b">Input + arena + operation records</text>
<rect x="760" y="360" width="312" height="157" rx="10" fill="#dce9ed" stroke="#bdcfd6"/>
<text x="782" y="393" font-size="23" fill="#172f40" font-weight="650">Shard 2 · startup thread</text>
<text x="782" y="425" font-size="18" fill="#172f40">Own IOCP + C private slots</text>
<text x="782" y="453" font-size="16" fill="#50636b">Associate socket, then receive</text>
<text x="782" y="483" font-size="16" fill="#50636b">Input + arena + operation records</text>
<rect x="32" y="542" width="1040" height="80" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/>
<text x="552" y="574" text-anchor="middle" font-size="18" fill="#172f40" font-weight="600">One admission ceiling: queued + transferring + adopted sockets ≤ C</text>
<text x="552" y="601" text-anchor="middle" font-size="16" fill="#50636b">Shutdown: stop publication → drain queues and operations → join owners → release storage</text>
</g></svg>
