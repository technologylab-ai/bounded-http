<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 595" role="img" aria-labelledby="topology-title topology-desc" class="diagram-svg">
<title id="topology-title">One cluster, several I/O owners</title><desc id="topology-desc">Three Linux shards have separate listeners, backends and slot storage. One shared counter bounds admitted connections. Shard zero uses the caller thread.</desc>
<defs><marker id="topology-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50636b"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="413" y="16" width="274" height="62" rx="10" fill="#172f40" stroke="#172f40"/><text x="550" y="55" font-size="23" fill="#fbfaf5" font-weight="600" text-anchor="middle">HTTP clients</text><path d="M 550 78 V 109" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#topology-arrow)"/><text x="550" y="139" font-size="18" fill="#50636b" font-weight="400" text-anchor="middle">Linux distributes connections across listeners</text><rect x="24" y="180" width="1052" height="391" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="48" y="217" font-size="15" fill="#d94b2b" font-weight="700" text-anchor="start">CLUSTER</text><text x="1050" y="217" font-size="16" fill="#50636b" font-weight="400" text-anchor="end">Example: three Linux shards</text><path d="M 550 152 V 166 H 192 V 243" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#topology-arrow)"/><rect x="48" y="245" width="288" height="230" rx="10" fill="#dce9ed" stroke="#bdcfd6"/><text x="70" y="281" font-size="23" fill="#172f40" font-weight="650" text-anchor="start">Shard 0</text><text x="70" y="310" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Caller thread</text><rect x="66" y="329" width="252" height="45" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="192" y="358" font-size="17" fill="#172f40" font-weight="500" text-anchor="middle">Listener + I/O backend</text><text x="70" y="410" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">128 reserved slots</text><text x="70" y="442" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Input + output + operation state</text><path d="M 550 152 V 166 H 550 V 243" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#topology-arrow)"/><rect x="406" y="245" width="288" height="230" rx="10" fill="#dce9ed" stroke="#bdcfd6"/><text x="428" y="281" font-size="23" fill="#172f40" font-weight="650" text-anchor="start">Shard 1</text><text x="428" y="310" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Startup thread</text><rect x="424" y="329" width="252" height="45" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="550" y="358" font-size="17" fill="#172f40" font-weight="500" text-anchor="middle">Listener + I/O backend</text><text x="428" y="410" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">128 reserved slots</text><text x="428" y="442" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Input + output + operation state</text><path d="M 550 152 V 166 H 908 V 243" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#topology-arrow)"/><rect x="764" y="245" width="288" height="230" rx="10" fill="#dce9ed" stroke="#bdcfd6"/><text x="786" y="281" font-size="23" fill="#172f40" font-weight="650" text-anchor="start">Shard 2</text><text x="786" y="310" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Startup thread</text><rect x="782" y="329" width="252" height="45" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="908" y="358" font-size="17" fill="#172f40" font-weight="500" text-anchor="middle">Listener + I/O backend</text><text x="786" y="410" font-size="20" fill="#172f40" font-weight="600" text-anchor="start">128 reserved slots</text><text x="786" y="442" font-size="15" fill="#50636b" font-weight="400" text-anchor="start">Input + output + operation state</text><rect x="48" y="500" width="1004" height="47" rx="10" fill="#e5ecdf" stroke="#c4d0bb"/><text x="550" y="530" font-size="17" fill="#172f40" font-weight="500" text-anchor="middle">Shared admission: 128 total  ·  Shared application state: synchronize mutable data</text></g></svg>
