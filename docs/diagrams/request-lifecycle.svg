<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc" class="diagram-svg">
<title id="request-lifecycle-title">Request handling returns actions to the I/O owner</title><desc id="request-lifecycle-desc">The owner receives and parses a complete bounded request. A callback returns flush, finish or close. Finished responses can accumulate in a bounded batch before submission. Flush resumes after local transport acceptance. Finish has no flushed event. Closing retains storage until every owner returns.</desc>
<defs><marker id="request-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#50636b"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="28" y="34" font-size="15" fill="#d94b2b" font-weight="700" text-anchor="start">ONE CONNECTION · DRAIN PATH</text><rect x="28" y="68" width="320" height="105" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="48" y="106" font-size="23" fill="#172f40" font-weight="600" text-anchor="start">Receive</text><text x="48" y="139" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Reserved input storage</text><rect x="390" y="68" width="320" height="105" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="410" y="106" font-size="23" fill="#172f40" font-weight="600" text-anchor="start">Parse</text><text x="410" y="139" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Framing and syntax validation</text><rect x="752" y="68" width="320" height="105" rx="10" fill="#dce9ed" stroke="#c8d0cb"/><text x="772" y="106" font-size="23" fill="#172f40" font-weight="600" text-anchor="start">Handle</text><text x="772" y="139" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Exclusive request/writer access</text><path d="M 348 120 H 386" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><path d="M 710 120 H 748" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><path d="M 912 173 V 234 H 550 V 265" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><text x="769" y="220" font-size="16" fill="#50636b" font-weight="400" text-anchor="start">flush or batch drain</text><path d="M 912 68 V 50 H 550 V 64" fill="none" stroke="#50636b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#request-lifecycle-arrow)"/><text x="1065" y="34" font-size="14" fill="#50636b" font-weight="400" text-anchor="end">finish + capacity → next buffered request</text><rect x="389" y="269" width="322" height="105" rx="10" fill="#e5ecdf" stroke="#c8d0cb"/><text x="410" y="307" font-size="23" fill="#172f40" font-weight="600" text-anchor="start">Freeze and submit</text><text x="410" y="340" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Keep response bytes unchanged.</text><path d="M 550 374 V 426" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><rect x="389" y="430" width="322" height="91" rx="10" fill="#fbfaf5" stroke="#c8d0cb"/><text x="410" y="466" font-size="19" fill="#172f40" font-weight="600" text-anchor="start">Terminal send completion</text><text x="410" y="497" font-size="16" fill="#50636b" font-weight="400" text-anchor="start">Record accepted bytes.</text><path d="M 550 521 V 541" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><rect x="389" y="545" width="322" height="80" rx="10" fill="#e5ecdf" stroke="#c8d0cb"/><text x="550" y="579" font-size="18" fill="#172f40" font-weight="600" text-anchor="middle">All snapshot bytes accepted?</text><text x="550" y="607" font-size="15" fill="#50636b" font-weight="400" text-anchor="middle">Only now advance the application.</text><path d="M 711 475 H 747 V 321 H 715" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><text x="778" y="478" font-size="18" fill="#172f40" font-weight="650" text-anchor="start">Partial send</text><text x="778" y="505" font-size="16" fill="#50636b" font-weight="400" text-anchor="start">Submit remaining bytes.</text><path d="M 711 585 H 1061 V 190 H 914 V 177" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><text x="790" y="397" font-size="18" fill="#172f40" font-weight="650" text-anchor="start">flush → .flushed</text><text x="790" y="424" font-size="16" fill="#50636b" font-weight="400" text-anchor="start">Resume the same request.</text><path d="M 389 585 H 53 V 192 H 187 V 177" fill="none" stroke="#50636b" stroke-width="2" marker-end="url(#request-lifecycle-arrow)"/><text x="82" y="395" font-size="18" fill="#172f40" font-weight="650" text-anchor="start">Batch drained</text><text x="82" y="423" font-size="16" fill="#50636b" font-weight="400" text-anchor="start">Continue with the next input.</text><rect x="28" y="690" width="1044" height="83" rx="10" fill="#f6e7df" stroke="#dfc3b6"/><text x="51" y="724" font-size="20" fill="#172f40" font-weight="650" text-anchor="start">Close or failure</text><text x="51" y="754" font-size="17" fill="#50636b" font-weight="400" text-anchor="start">Cancel outstanding work. Reuse the slot only after application, target and cancel owners return.</text></g></svg>
